<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — SatvikMeals</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDFCF8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border:1px solid #E5E2D8;border-radius:16px;padding:48px;max-width:460px;width:100%;animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:#1B4332;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;margin-bottom:32px}
.logo-mark{width:34px;height:34px;background:#1B4332;border-radius:7px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:#FAF8F3}
h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:#0F2D1F;margin-bottom:4px}
h1 em{font-style:italic;color:#2D6A4F}
.subtitle{font-size:0.845rem;color:#7A7A6E;font-weight:300;margin-bottom:28px}
.summary{background:#F0FAF2;border:1px solid #D8F3DC;border-radius:10px;padding:20px;margin-bottom:24px}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #E5E2D8;font-size:0.855rem}
.summary-row:last-child{border:none;font-weight:500;color:#1B4332;font-size:0.95rem;padding-top:12px}
.summary-label{color:#7A7A6E;font-weight:300}
.coin-row{color:#B5965A!important}
.phone-section{margin-bottom:24px}
.phone-section label{display:block;font-size:0.72rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#7A7A6E;margin-bottom:6px}
.phone-section input{width:100%;height:44px;border:1px solid #E5E2D8;border-radius:8px;padding:0 14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none}
.phone-section input:focus{border-color:#40916C}
.phone-note{font-size:0.75rem;color:#7A7A6E;font-weight:300;margin-top:6px}
.btn-pay{width:100%;height:50px;background:#1B4332;color:white;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-pay:hover{background:#2D6A4F}
.btn-pay:disabled{background:#ccc;cursor:not-allowed}
.btn-pay svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.secure-note{text-align:center;font-size:0.75rem;color:#7A7A6E;font-weight:300;margin-top:12px}
.back-link{display:block;text-align:center;margin-top:16px;font-size:0.8rem;color:#7A7A6E;text-decoration:none}
.back-link:hover{color:#1B4332}
#errMsg{background:#FFF5F5;border:1px solid #FED7D7;color:#c53030;padding:12px;border-radius:8px;font-size:0.845rem;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 4 5 4 9c0 2.5 1.2 4.7 3 6.1V20h10v-4.9c1.8-1.4 3-3.6 3-6.1 0-4-4-7-8-7z"/></svg></div>SatvikMeals</a>
  <h1>Confirm <em>your order</em></h1>
  <div class="subtitle">Review details and proceed to secure payment.</div>
  <div class="summary" id="summary"></div>
  <div class="phone-section" id="phoneSection" style="display:none">
    <label>Mobile Number</label>
    <input type="tel" id="phoneInput" placeholder="10-digit number" maxlength="10"/>
    <div class="phone-note">Required for delivery coordination</div>
  </div>
  <button class="btn-pay" id="payBtn" onclick="pay()">
    Proceed to Payment
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  </button>
  <div class="secure-note">Secured by Instamojo. Your payment info is never stored.</div>
  <a href="plans.html" class="back-link">← Back to plans</a>
  <div id="errMsg"></div>
</div>
<script>
const API   = 'http://localhost:5000';
const token = localStorage.getItem('satvikToken');
if (!token) window.location.href = 'login.html?redirect=plans.html';

const p = new URLSearchParams(window.location.search);
const planId   = p.get('planId');
const planName = p.get('planName');
const price    = parseInt(p.get('price'));
const coins    = parseInt(p.get('coins')||0);
const final    = price - coins;

let userPhone = null;

async function init() {
  try {
    const r = await fetch(API+'/api/user/dashboard',{headers:{Authorization:'Bearer '+token}});
    const d = await r.json();
    userPhone = d.phone;
    if (!d.phone) document.getElementById('phoneSection').style.display='block';
  } catch(e){}

  let html = `<div class="summary-row"><span class="summary-label">Plan</span><span>${decodeURIComponent(planName)}</span></div>
    <div class="summary-row"><span class="summary-label">Original Price</span><span>&#8377;${price}</span></div>`;
  if (coins>0) html += `<div class="summary-row coin-row"><span class="summary-label">Coins Discount</span><span>- &#8377;${coins}</span></div>`;
  html += `<div class="summary-row"><span>Total Payable</span><span>&#8377;${final}</span></div>`;
  document.getElementById('summary').innerHTML = html;
}

async function pay() {
  const btn = document.getElementById('payBtn');
  btn.disabled=true; btn.innerHTML='Creating payment request...';

  // Save phone if entered
  const phoneInput = document.getElementById('phoneInput').value.trim();
  if (!userPhone && phoneInput) {
    if (!/^[6-9]\d{9}$/.test(phoneInput)) { showErr('Enter valid 10-digit phone number'); btn.disabled=false; btn.innerHTML='Proceed to Payment'; return; }
    const pr = await fetch(API+'/api/auth/phone',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({phone:phoneInput})});
    if (!pr.ok) { showErr('Could not save phone number'); btn.disabled=false; btn.innerHTML='Proceed to Payment'; return; }
  } else if (!userPhone && !phoneInput) {
    showErr('Please enter your phone number'); btn.disabled=false; btn.innerHTML='Proceed to Payment'; return;
  }

  try {
    const r = await fetch(API+'/api/payment/create',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({ planId, useCoins: coins>0 })
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.message); btn.disabled=false; btn.innerHTML='Proceed to Payment'; return; }
    window.location.href = d.paymentUrl;
  } catch(e) {
    showErr('Network error. Is server running?');
    btn.disabled=false; btn.innerHTML='Proceed to Payment';
  }
}

function showErr(msg){ const e=document.getElementById('errMsg'); e.textContent=msg; e.style.display='block'; }
init();
</script>
</body>
</html>
