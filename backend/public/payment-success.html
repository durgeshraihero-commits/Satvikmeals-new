<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment — SatvikMeals</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDFCF8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border:1px solid #E5E2D8;border-radius:16px;padding:56px 48px;max-width:440px;width:100%;text-align:center}
.icon{width:72px;height:72px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.icon.success{background:#D8F3DC}
.icon.fail{background:#FFF0F0}
.icon.loading{background:#F0FAF2;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
h1{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;color:#0F2D1F;margin-bottom:10px}
p{font-size:0.875rem;color:#7A7A6E;font-weight:300;line-height:1.7;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 28px;background:#1B4332;color:white;text-decoration:none;border-radius:8px;font-size:0.82rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;margin-top:24px}
.detail{background:#F0FAF2;border-radius:8px;padding:16px;margin:20px 0;text-align:left}
.detail-row{display:flex;justify-content:space-between;font-size:0.82rem;padding:4px 0;border-bottom:1px solid #E5E2D8}
.detail-row:last-child{border:none;font-weight:500;color:#1B4332}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon loading" id="icon">⏳</div>
  <h1 id="title">Verifying payment...</h1>
  <p id="msg">Please wait. Do not close this page.</p>
</div>
<script>
const API   = '';
const token = localStorage.getItem('satvikToken');
const params = new URLSearchParams(window.location.search);
const paymentId  = params.get('payment_id');
const paymentReq = params.get('payment_request_id');
const status     = params.get('payment_status');

async function verify() {
  if (!paymentId || !paymentReq) {
    showFail('Missing payment details. Please contact support.');
    return;
  }
  if (!token) { window.location.href='login.html'; return; }

  try {
    const r = await fetch(API+'/api/payment/verify', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ payment_id: paymentId, payment_request_id: paymentReq })
    });
    const d = await r.json();
    if (r.ok) {
      showSuccess(d);
    } else {
      showFail(d.message);
    }
  } catch(e) {
    showFail('Network error. Please contact support.');
  }
}

function showSuccess(d) {
  document.getElementById('icon').textContent = '✓';
  document.getElementById('icon').className = 'icon success';
  document.getElementById('title').textContent = 'Payment Successful!';
  document.getElementById('msg').textContent = 'Your subscription is now active. Meals will be delivered from tomorrow.';
  document.getElementById('card').innerHTML += `<div class="detail">
    <div class="detail-row"><span>Payment ID</span><span>${paymentId}</span></div>
    <div class="detail-row"><span>Status</span><span>Paid</span></div>
  </div>
  <a href="dashboard.html" class="btn">Go to Dashboard</a>`;
}

function showFail(msg) {
  document.getElementById('icon').textContent = '✗';
  document.getElementById('icon').className = 'icon fail';
  document.getElementById('title').textContent = 'Payment Failed';
  document.getElementById('msg').textContent = msg;
  document.getElementById('card').innerHTML += `<a href="plans.html" class="btn" style="background:#c0392b">Try Again</a>`;
}

verify();
</script>
</body>
</html>
