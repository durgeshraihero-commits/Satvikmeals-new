<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>This Week's Menu — SatvikMeals</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--green-900:#0F2D1F;--green-800:#1B4332;--green-700:#2D6A4F;--green-600:#40916C;--green-50:#F0FAF2;--cream:#FAF8F3;--warm-white:#FDFCF8;--text-dark:#1A1A16;--text-mid:#3D3D35;--text-light:#7A7A6E;--border:#E5E2D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--warm-white);color:var(--text-dark)}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(253,252,248,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:68px;display:flex;align-items:center;padding:0 32px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--green-800);font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600}
.logo-mark{width:36px;height:36px;background:var(--green-800);border-radius:7px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:20px;height:20px;fill:var(--cream)}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-mid);text-decoration:none}
.btn-nav{background:var(--green-800);color:var(--cream)!important;padding:8px 18px;border-radius:6px}
main{padding-top:68px}
.hero{background:var(--green-900);padding:64px 32px 52px;text-align:center}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);font-weight:300;color:white;margin-bottom:12px}
.hero h1 em{font-style:italic;color:#D8F3DC}
.hero p{color:rgba(255,255,255,0.55);font-size:0.9rem;font-weight:300}
.container{max-width:1000px;margin:0 auto;padding:48px 24px 80px}
.week-label{font-size:0.72rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--green-600);margin-bottom:32px;display:flex;align-items:center;gap:10px}
.week-label::before{content:'';width:24px;height:1px;background:var(--green-600)}
.day-grid{display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.day-row{background:white;display:grid;grid-template-columns:120px 1fr 1fr;border-bottom:1px solid var(--border)}
.day-row:last-child{border-bottom:none}
.day-header-row{background:var(--green-900);display:grid;grid-template-columns:120px 1fr 1fr;border-radius:13px 13px 0 0}
.day-cell{padding:20px 24px;font-size:0.875rem}
.day-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:500;color:var(--green-900);padding:20px 24px;display:flex;align-items:center}
.meal-type-badge{font-size:0.65rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--green-50);color:var(--green-700);border:1px solid #D8F3DC;margin-left:8px;align-self:center}
.col-header{padding:14px 24px;font-size:0.68rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5)}
.items{list-style:none;display:flex;flex-direction:column;gap:5px}
.items li{font-size:0.855rem;color:var(--text-mid);font-weight:300;display:flex;align-items:center;gap:7px}
.items li::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--green-600);flex-shrink:0}
.loading{text-align:center;padding:60px;color:var(--text-light)}
.cta{text-align:center;margin-top:52px}
.cta h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:var(--green-900);margin-bottom:12px}
.cta p{color:var(--text-light);font-size:0.9rem;font-weight:300;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--green-800);color:white;text-decoration:none;border-radius:7px;font-size:0.82rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase}
@media(max-width:768px){nav{padding:0 14px;height:56px}.logo{font-size:1.05rem}.logo img{width:28px;height:28px}.nav-links{gap:10px}.nav-links a{font-size:0.68rem;letter-spacing:0.02em}.btn-nav{padding:6px 12px;font-size:0.68rem}.coins-badge{display:none!important}}.nav-links li:last-child a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo"><img src="/logo.jpg" alt="SatvikMeals" style="width:36px;height:36px;border-radius:8px;object-fit:cover;"/>SatvikMeals</a>
  <ul class="nav-links">
    <li><a href="menu.html">Menu</a></li>
    <li><a href="plans.html">Plans</a></li>
    <li><a href="support.html">Support</a></li>
    <li><a href="login.html" class="btn-nav">Login</a></li>
  </ul>
</nav>
<main>
  <div class="hero">
    <h1>This Week's <em>Menu</em></h1>
    <p>Fresh, home-style meals — prepared daily, delivered on time.</p>
  </div>
  <div class="container">
    <div class="week-label">Weekly Schedule</div>
    <div id="menuContainer"><div class="loading">Loading menu...</div></div>
    <div class="cta">
      <h2>Like what you see?</h2>
      <p>Subscribe to receive this menu delivered to your door every day.</p>
      <a href="plans.html" class="btn">View Subscription Plans</a>
    </div>
  </div>
</main>
<script>
async function loadMenu() {
  try {
    const res = await fetch('/api/menu/current');
    const data = await res.json();
    const container = document.getElementById('menuContainer');
    if (!data.items || !data.items.length) {
      container.innerHTML = '<div class="loading">Menu not published yet. Check back soon.</div>'; return;
    }
    container.innerHTML = `
      <div class="day-grid">
        <div class="day-header-row">
          <div class="col-header">Day</div>
          <div class="col-header">Lunch</div>
          <div class="col-header">Dinner</div>
        </div>
        ${data.items.map(item => `
          <div class="day-row">
            <div class="day-name">${item.day}<span class="meal-type-badge">${item.mealType}</span></div>
            <div class="day-cell"><ul class="items">${(item.lunchItems||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>
            <div class="day-cell"><ul class="items">${(item.dinnerItems||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>
          </div>
        `).join('')}
      </div>`;
  } catch(e) {
    document.getElementById('menuContainer').innerHTML = '<div class="loading">Could not load menu. Is the server running?</div>';
  }
}
loadMenu();
</script>
</body>
</html>
