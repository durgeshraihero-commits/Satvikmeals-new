<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — SatvikMeals</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--g9:#0F2D1F;--g8:#1B4332;--g7:#2D6A4F;--g6:#40916C;--g0:#F0FAF2;--cream:#FAF8F3;--ww:#FDFCF8;--td:#1A1A16;--tl:#7A7A6E;--bd:#E5E2D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--ww);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border:1px solid var(--bd);border-radius:16px;padding:44px 36px;max-width:400px;width:100%;text-align:center;animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--g8);font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;margin-bottom:28px}
.logo-mark{width:38px;height:38px;background:var(--g8);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:20px;height:20px;fill:var(--cream)}
h1{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;color:var(--g9);margin-bottom:6px}
h1 em{font-style:italic;color:var(--g7)}
.sub{font-size:0.845rem;color:var(--tl);font-weight:300;line-height:1.7;margin-bottom:24px}
.ref-box{background:var(--g0);border:1px solid #D8F3DC;border-radius:10px;padding:14px;margin-bottom:20px;text-align:left}
.ref-box label{font-size:0.68rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--g7);display:block;margin-bottom:5px}
.ref-box input{width:100%;height:38px;border:1px solid #D8F3DC;border-radius:7px;padding:0 12px;font-family:'DM Sans',sans-serif;font-size:0.875rem;background:white;outline:none;text-transform:uppercase;letter-spacing:0.08em}
.ref-box input:focus{border-color:var(--g6)}
.ref-note{font-size:0.7rem;color:var(--g7);margin-top:5px;font-weight:300}

/* Google rendered button wrapper — centered */
#googleSignInDiv{display:flex;justify-content:center;margin-bottom:14px}
#googleSignInDiv iframe{border-radius:8px!important}

/* Dev login box */
.dev-box{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:18px;margin-bottom:14px;text-align:left}
.dev-box h3{font-size:0.84rem;font-weight:500;color:#0C4A6E;margin-bottom:5px}
.dev-box p{font-size:0.75rem;color:#075985;font-weight:300;line-height:1.55;margin-bottom:10px}
.dev-input{width:100%;height:38px;border:1px solid #BAE6FD;border-radius:6px;padding:0 10px;font-size:0.845rem;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:8px;background:white}
.dev-input:focus{border-color:#0369A1}
.btn-dev{height:40px;background:#0369A1;color:white;border:none;border-radius:7px;font-size:0.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;font-weight:500;letter-spacing:0.04em}
.btn-dev:hover{background:#0284C7}

#status{padding:11px 14px;border-radius:8px;font-size:0.845rem;margin-top:10px;display:none;text-align:left}
#status.success{background:var(--g0);color:var(--g8)}
#status.error{background:#FFF5F5;color:#c53030;border-left:3px solid #c53030}
#status.loading{background:#F5F5F5;color:var(--tl)}
.note{font-size:0.7rem;color:var(--tl);font-weight:300;line-height:1.6;margin-top:14px}
.note a{color:var(--g7);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 4 5 4 9c0 2.5 1.2 4.7 3 6.1V20h10v-4.9c1.8-1.4 3-3.6 3-6.1 0-4-4-7-8-7z"/></svg></div>
    SatvikMeals
  </a>
  <h1>Welcome <em>back.</em></h1>
  <div class="sub">Sign in to manage your meals, subscription, and delivery.</div>

  <div class="ref-box">
    <label>Referral Code (Optional)</label>
    <input type="text" id="refInput" placeholder="E.G. ABC123" maxlength="8"/>
    <div class="ref-note">Have a friend's referral code? Enter it here before signing in.</div>
  </div>

  <!-- Google renders its button here — only one button, centered -->
  <div id="googleSignInDiv"></div>

  <!-- Dev login — shown only when no Google Client ID -->
  <div class="dev-box" id="devBox" style="display:none">
    <h3>Quick Login</h3>
    <p>Enter your name and email to access your dashboard.</p>
    <input class="dev-input" id="devName" placeholder="Your Name"/>
    <input class="dev-input" id="devEmail" placeholder="your@email.com" type="email"/>
    <button class="btn-dev" onclick="devLogin()">Login →</button>
  </div>

  <div id="status"></div>
  <div class="note">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</div>
</div>

<script>
const API = '';
const GOOGLE_CLIENT_ID = '213132143602-an29ji4fuv3393o62bq1ke8roak4q7u8.apps.googleusercontent.com';

if (localStorage.getItem('satvikToken')) {
  const redirect = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
  window.location.href = redirect;
}

const refCode = new URLSearchParams(window.location.search).get('ref') || '';
if (refCode) document.getElementById('refInput').value = refCode.toUpperCase();

if (GOOGLE_CLIENT_ID) {
  // Load Google GSI script — it renders ONE button inside #googleSignInDiv
  const script = document.createElement('script');
  script.src = 'https://accounts.google.com/gsi/client';
  script.onload = () => {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true
    });
    // Render only ONE button
    google.accounts.id.renderButton(
      document.getElementById('googleSignInDiv'),
      { theme: 'outline', size: 'large', width: 320, text: 'continue_with', shape: 'rectangular' }
    );
  };
  document.head.appendChild(script);
} else {
  // No Google Client ID — show dev login
  document.getElementById('devBox').style.display = 'block';
}

async function handleGoogleCredential(response) {
  showStatus('Signing in...', 'loading');
  const referralCode = document.getElementById('refInput').value.trim().toUpperCase();
  try {
    const r = await fetch(API + '/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: response.credential, referralCode })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    saveAndRedirect(d);
  } catch(err) {
    showStatus(err.message || 'Login failed. Try again.', 'error');
  }
}

async function devLogin() {
  const name  = document.getElementById('devName').value.trim();
  const email = document.getElementById('devEmail').value.trim().toLowerCase();
  const referralCode = document.getElementById('refInput').value.trim().toUpperCase();
  if (!name || !email) { showStatus('Enter your name and email', 'error'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showStatus('Enter a valid email', 'error'); return; }
  showStatus('Logging in...', 'loading');
  try {
    const r = await fetch(API + '/api/auth/dev-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, referralCode })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    saveAndRedirect(d);
  } catch(err) {
    showStatus(err.message || 'Login failed.', 'error');
  }
}

function saveAndRedirect(d) {
  localStorage.setItem('satvikToken', d.token);
  localStorage.setItem('satvikUser', JSON.stringify(d.user));
  showStatus('Login successful! Redirecting...', 'success');
  const redirect = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
  setTimeout(() => {
    window.location.href = d.user.role === 'admin' ? 'admin.html' : redirect;
  }, 600);
}

function showStatus(msg, type) {
  const s = document.getElementById('status');
  s.textContent = msg; s.className = type; s.style.display = 'block';
}
</script>
</body>
</html>
